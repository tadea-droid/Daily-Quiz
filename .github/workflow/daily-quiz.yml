name: Daily Quiz

on:
  schedule:
    # 21:00 UTC Sun-Thu = 07:00-08:00 Sydney Mon-Fri, depending on daylight saving.
    # Sydney doesn't have a fixed UTC offset, so the exact time drifts by an
    # hour twice a year around the daylight saving changeovers.
    - cron: "0 21 * * 0-4"
  workflow_dispatch: {}

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/quiz.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SET_SECRET: ${{ secrets.SET_SECRET }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
