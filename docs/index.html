<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Quiz</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #111111;
    --muted: #666666;
    --border: #dddddd;
    --correct: #1a7f37;
    --incorrect: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #eeeeee; --muted: #999999; --border: #333333; }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  #date { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  #question { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--fg);
    min-height: 80px;
    font-family: inherit;
  }
  button {
    margin-top: 12px;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: var(--fg);
    color: var(--bg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 20px; padding: 14px; border-radius: 6px; display: none; }
  #result.correct { background: color-mix(in srgb, var(--correct) 15%, transparent); border: 1px solid var(--correct); }
  #result.incorrect { background: color-mix(in srgb, var(--incorrect) 15%, transparent); border: 1px solid var(--incorrect); }
  #result .verdict { font-weight: 600; margin-bottom: 6px; }
  #answer-line { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>

<h1>Daily Quiz</h1>
<div id="date">Loading today's question...</div>
<div id="question"></div>

<textarea id="userAnswer" placeholder="Type your answer here"></textarea>
<br>
<button id="submitBtn">Check answer</button>

<div id="result"></div>

<script>
  // Set this to your deployed Cloudflare Worker URL, no trailing slash.
  const WORKER_URL = "https://REPLACE_WITH_YOUR_WORKER_URL.workers.dev";

  const dateEl = document.getElementById("date");
  const questionEl = document.getElementById("question");
  const answerEl = document.getElementById("userAnswer");
  const submitBtn = document.getElementById("submitBtn");
  const resultEl = document.getElementById("result");

  async function loadToday() {
    try {
      const res = await fetch(`${WORKER_URL}/today`);
      const data = await res.json();
      if (!data.question) {
        dateEl.textContent = "No question set yet. Check back after the next run.";
        submitBtn.disabled = true;
        return;
      }
      dateEl.textContent = data.date;
      questionEl.textContent = data.question;
    } catch (err) {
      dateEl.textContent = "Could not reach the quiz worker.";
      submitBtn.disabled = true;
    }
  }

  async function submitAnswer() {
    const answer = answerEl.value.trim();
    if (!answer) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Checking...";

    try {
      const res = await fetch(`${WORKER_URL}/grade`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer }),
      });
      const data = await res.json();

      resultEl.style.display = "block";
      resultEl.className = data.correct ? "correct" : "incorrect";
      resultEl.innerHTML = `
        <div class="verdict">${data.correct ? "Correct." : "Not quite."}</div>
        <div>${data.feedback || ""}</div>
        <div id="answer-line">Correct answer: ${data.correctAnswer || "unavailable"}</div>
      `;
    } catch (err) {
      resultEl.style.display = "block";
      resultEl.className = "incorrect";
      resultEl.textContent = "Could not grade your answer. Try again shortly.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Check answer";
    }
  }

  submitBtn.addEventListener("click", submitAnswer);
  loadToday();
</script>

</body>
</html>
